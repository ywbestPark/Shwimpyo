mind:"나는 이유를 대지 않는다. 사실만 말한다.",
say:["이제는 술을 원치 않아요.","이제는 마실 필요가 없어요.","저는 비음주자예요."],
do:["웃으면서, 한 문장으로 끝내기","운전이나 약 같은 핑계는 대지 않기","바로 다른 화제로 넘기기"]},
{i:"🗣️",t:"“조금은 괜찮아”라고 설득할 때",sub:"동료의 설득 앞에서",
book:"책은 ‘딱 한 잔’에 즐거움이 있다고 믿으면 백만 잔에도 있다고 믿게 된다고 말합니다. 한 잔은 연쇄반응의 시작입니다.",
mind:"한 잔은 한 잔으로 끝나지 않는다. 첫 잔이 전부의 시작이다.",

do:["“다음에 마실게요”, “오늘만 쉴게요”는 말하지 않기 (문을 열어 두는 말입니다)","설득이 길어지면 자리에서 잠깐 일어나기"]},

book:"책은 술 생각을 억지로 안 하려 하지 말라고 합니다. 생각이 날 때마다 관점을 바꾸라고 합니다.",

const P=[
["결단하라","마지막 잔을 든 뒤에는 다시 입에 대지 않겠다고 정합니다. 마시게 하거나 마시지 않게 하는 사람은 나뿐입니다."],
["포기할 것이 없다","술의 장점처럼 보이는 것은 환상이라고 책은 말합니다. 포기한다고 생각하면 어려워집니다."],
["“난 마시면 안 돼”라고 말하지 않기","못 마신다고 생각하면 박탈감이 생깁니다. “난 필요 없다”로 바꿉니다."],
["술 생각을 하라","생각이 나면 “난 이제 술이 필요 없어. 난 자유야”라고 받아들입니다."],
["우울해하지 말고 자유를 즐기기","마지막 잔부터 이미 자유라고 책은 말합니다."],
["끊은 날짜를 세지 않기","책은 날짜를 세는 일이 계속 견디는 중이라는 신호라고 봅니다."],
["사람들과의 자리를 피하지 않기","끊은 것이지 삶을 멈춘 것이 아닙니다."],
["“딱 한 잔만”은 금물","한 잔이 연쇄반응의 시작입니다."],
["다른 것으로 대체하지 않기","무알코올 맥주 등은 희생하고 있다는 느낌을 굳힌다고 합니다."],
["마시는 사람을 부러워하지 않기","책은 부러움이 아니라 측은함의 대상이라고 봅니다."],
["이 책은 안전망이 아니다","다시 마셔도 책으로 돌아오면 된다는 생각은 금물이라고 책은 경고합니다."]
];
const M=[
["술이 긴장을 풀어준다","책은 긴장을 풀어주는 것이 술이 아니라 편안한 상황이라고 봅니다. 집 거실처럼 원래 편한 곳에서 마셨으니 효과가 있었다고 착각한다는 것입니다. 불안하고 초조한 상황에서 마시면 긴장은 풀리지 않습니다. 게다가 알코올은 몸에서 탈수와 저혈당을 일으키고 간과 신장에 부담을 주어, 몸을 오히려 긴장시킨다고 설명합니다. 몸이 처지고 무거운 느낌을 ‘풀렸다’고 부르도록 길들여졌을 뿐이라고 합니다.","불안한 상황에서 마셔서 정말 편해진 적이 있었나?"],
["술이 스트레스를 풀어준다","책은 술이 스트레스를 없애 주는 것이 아니라 새로 만든다고 봅니다. 마신 다음 날은 몸, 마음, 돈, 관계가 모두 더 힘들어집니다. 특히 전날 무슨 말과 행동을 했는지 기억이 안 나 걱정하는 것이 가장 큰 스트레스라고 합니다. 또 매번 양을 조절해야 하는 압박, 다음에 언제 마실지 조바심 내는 것도 술이 만든 스트레스입니다. 술을 마시지 않는 사람에게는 이런 스트레스가 아예 없습니다.","마신 다음 날 아침 내 기분은 어땠나?"],
["술이 용기와 자신감을 준다","책은 술이 자연스러운 두려움을 없앨 뿐이라고 봅니다. 두려움이 사라지면 몸의 안전장치가 꺼져 위험에 무방비가 되고, 이것을 용기라고 착각한다는 것입니다. 술김에 부린 만용은 진짜 용기가 아닙니다. 책은 오히려 술이 오랜 시간에 걸쳐 진짜 용기와 자신감을 조금씩 갉아먹어, ‘술 없이는 못 한다’고 믿게 만든다고 말합니다. 그래서 술을 끊고 얻는 가장 큰 것이 용기와 자신감이라고 합니다.","술김에 한 행동을 맨정신의 내가 자랑스러워했나?"],
["술을 마시면 더 즐겁다","책은 즐거움을 만드는 것이 사람, 농담, 음악, 함께 있는 시간이지 술이 아니라고 봅니다. 술 덕분이 아니라 술에도 불구하고 행복했던 것이라는 설명입니다. 그리고 즐거웠다는 기억이 없는 밤에 대해 묻습니다. 다음 날 “기억은 안 나지만 아마 재미있었을 거야”라고 말한다면, 기억하지 못하는 일이 어떻게 즐거울 수 있느냐는 것입니다.","기억이 끊긴 밤을 즐거웠다고 말할 수 있나?"],
["술은 사교에 도움이 된다","책은 술이 오르는 순간 소통이 끊기고 사교가 멈춘다고 봅니다. 새해 전야 파티에서 처음 두어 시간은 좋았지만, 이후 비속어, 울음, 시기, 토하고 쓰러지는 사람들 속에서 대화할 상대가 사라졌다고 합니다. 처음 만난 자리의 어색함도 술로 풀리지 않고, 내성적인 사람은 더 위축된다고 합니다. 술을 끊어도 나는 여전히 똑같은 사람으로 즐길 수 있다는 것이 책의 경험입니다.","술이 오른 사람과 실제로 대화가 이어지던가?"],
["적당히 조절해서 마시면 된다","책은 조절하려고 의지력을 써야 한다는 사실 자체가 이미 제어력을 잃었다는 뜻이라고 봅니다. 한 잔이 들어가면 선택권이 술로 넘어가 두 잔, 열 잔이 됩니다. 마시지 않는 쪽이 오히려 훨씬 쉽다는 것이 책의 주장입니다. 술을 줄이려고 매번 싸우는 것 자체가 스트레스이고, 그 싸움을 끝내는 방법이 완전히 끊는 것이라고 합니다.","마시기 전에 정한 양에서 멈춘 날이 몇 번이었나?"],

function render(){
 app.innerHTML={sos,learn,story,pledge,help}[tab]();
 nav.innerHTML=[["sos","지금 도움"],["learn","읽기"],["story","경험담"],["pledge","결단"],["help","도움받기"]]
  .map(a=>`<button data-t="${a[0]}" aria-current="${tab===a[0]}">${a[1]}</button>`).join("");
 const bk=document.getElementById("bk");if(bk)bk.onclick=()=>{cur=null;render();scrollTo(0,0)};
 app.querySelectorAll(".sit").forEach(b=>b.onclick=()=>{cur=+b.dataset.n;render();scrollTo(0,0)});
 nav.querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;cur=null;render();scrollTo(0,0)});
 const pl=document.getElementById("pl");if(pl)pl.oninput=()=>ss("pl",pl.value);
 app.querySelectorAll("input[data-c]").forEach(i=>i.onchange=()=>{
  const l=[...app.querySelectorAll("input[data-c]")].filter(x=>x.checked).map(x=>+x.dataset.c);ss("ck",JSON.stringify(l))});
 app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
 const ad=document.getElementById("ad");if(ad)ad.onclick=()=>{const v=document.getElementById("ex").value.trim();if(!v)return;const l=JSON.parse(sg("log","[]"));l.unshift({d:new Date().toLocaleDateString("ko-KR"),t:v});ss("log",JSON.stringify(l));render()};
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const l=JSON.parse(sg("log","[]"));l.splice(+b.dataset.del,1);ss("log",JSON.stringify(l));render()});
 const cp=document.getElementById("cp");if(cp)cp.onclick=()=>{const l=JSON.parse(sg("log","[]"));try{navigator.clipboard.writeText(l.map(x=>x.d+"\n"+x.t).join("\n\n")).then(()=>{cp.textContent="복사했습니다"})}catch(e){}};
 const rs=document.getElementById("rs");if(rs)rs.onclick=()=>{ss("ck","[]");render()};
}
render();
