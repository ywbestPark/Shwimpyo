<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉼표</title>
<meta name="theme-color" content="#4f7a6a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쉼표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#2a2a28;--sub:#6b6a66;--ac:#4f7a6a;--acbg:#e3eee9;--bd:#e2dfd6;--warn:#b4492f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1b;--card:#262826;--tx:#ecebe6;--sub:#a3a29b;--ac:#8fc0ad;--acbg:#2c3a35;--bd:#3a3c38;--warn:#e58a72}}
:root[data-theme="dark"]{--bg:#1c1d1b;--card:#262826;--tx:#ecebe6;--sub:#a3a29b;--ac:#8fc0ad;--acbg:#2c3a35;--bd:#3a3c38;--warn:#e58a72}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 20px 96px}
h1{font-size:26px;margin:32px 0 8px}h2{font-size:20px;margin:24px 0 12px;line-height:1.4}
p{margin:0 0 12px}.sub{color:var(--sub);font-size:14px}
.promise{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 16px;margin:20px 0}
.promise div{padding:10px 0;border-bottom:1px solid var(--bd)}.promise div:last-child{border:0}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:0 0 10px}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.pri{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;margin-top:16px;font-weight:600}
:root[data-theme="dark"] .pri,:root:not([data-theme="light"]) .pri{color:#10201a}
.ghost{background:none;border:0;color:var(--sub);padding:12px 0;text-decoration:underline;font-size:14px}
.bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
.mirror{background:var(--acbg);border-radius:14px;padding:16px;margin:12px 0 20px}
.cmp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cmp h3{margin:0 0 8px;font-size:17px}.cmp dt{font-size:12px;color:var(--sub);margin-top:8px}.cmp dd{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.dock button{background:none;border:0;font-size:13px;color:var(--sub);padding:6px 4px}
.dock .sos{color:var(--warn);font-weight:600}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:420px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
</style>
</head>
<body>
<main id="app"></main>
<div class="dock">
  <button class="sos" onclick="sos.showModal()">긴급 도움</button>
  <button id="backBtn" onclick="back()" style="visibility:hidden">← 이전</button>
  <button onclick="restart()">처음으로</button>
  <button onclick="wipe()">기록 모두 삭제</button>
</div>

<dialog id="sos">
  <h2 style="margin-top:0">지금 안전이 걱정된다면</h2>
  <p>폭력이나 위협이 있거나 스스로를 해칠 것 같다면 먼저 아래로 연락해 주세요.</p>
  <p><b>112</b> 긴급 신고<br><b>1366</b> 여성긴급전화(24시간)<br><b>109</b> 자살예방 상담전화</p>
  <button class="pri" onclick="sos.close()">닫기</button>
</dialog>

<script>
// 앱 상태: 서버로 전송하지 않고 이 기기(localStorage)에만 저장한다는 약속을 코드로도 지킨다.
var KEY="shwimpyo.v1", S={step:0,a:{}};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function wipe(){if(!confirm("이 기기에 저장된 기록을 모두 지울까요?"))return;try{localStorage.removeItem(KEY)}catch(e){}S={step:0,a:{},hist:[]};render()}
function restart(){S.step=0;S.a={};S.hist=[];save();render()}

// 질문 정의: 모든 질문에 '잘 모르겠어요'와 '건너뛰기'를 둔다 (자유 서술은 요구하지 않음)
var Q=[
 {k:"feel",t:"요즘 마음에 가장 가까운 건 어느 쪽인가요?",o:["이혼 쪽으로 마음이 기울어요","잠시 떨어져 지내고 싶어요","관계를 다시 이어가고 싶어요","마음이 왔다 갔다 해요","아직 정리가 안 돼요"]},
 {k:"years",t:"함께한 시간은 어느 정도인가요?",o:["5년 미만","5~15년","15년 이상","말하고 싶지 않아요"]},
 {k:"kids",t:"함께 돌보는 아이가 있나요?",o:["미성년 자녀가 있어요","자녀가 이미 성인이에요","없어요","말하고 싶지 않아요"]},
 {k:"hard",t:"요즘 가장 마음이 무거운 부분은요? (여러 개 골라도 돼요)",multi:1,o:["자주 부딪혀요","믿음이 흔들렸어요","대화가 잘 안 돼요","돈 문제가 걱정돼요","외롭고 지쳐요","아이가 걱정돼요","잘 모르겠어요"]},
 // 안전 확인: 첫 번째 선택지("아니요") 외를 고르면 긴급 안내를 먼저 보여준다 (pick() 참고)
 {k:"safe",t:"혹시 지금 안전이 걱정되는 일이 있나요?",o:["아니요","조금 불안해요","네, 안전이 걱정돼요"]}
];
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderStep(){
 if(S.step===0)return intro();
 if(S.step<=Q.length)return ask(S.step-1);
 if(S.step===Q.length+1)return mirror();
 if(S.step===Q.length+2)return compare();
 if(S.step===Q.length+3)return talk();
 if(S.step===Q.length+4)return browse();
 if(S.step===Q.length+5)return cases();
}
function render(){renderStep();updateDock()}
function go(n){
 if(S.step!==n){S.hist=S.hist||[];S.hist.push(S.step)} // 이전으로 돌아갈 수 있도록 현재 단계 기록
 S.step=n;save();render();window.scrollTo(0,0)
}
function back(){
 var h=S.hist||[];if(!h.length)return;
 S.step=h.pop();save();render();window.scrollTo(0,0)
}
// 이전 버튼은 돌아갈 곳이 있을 때만 보이게 한다
function updateDock(){var b=document.getElementById("backBtn");if(b)b.style.visibility=(S.hist&&S.hist.length)?"visible":"hidden"}

function intro(){
 app.innerHTML='<h1>쉼표</h1><p class="sub">마음을 정리하는 잠깐의 쉼</p>'+
 '<div class="promise"><div>이름·연락처는 묻지 않아요</div><div>내용은 이 기기에만 저장돼요</div><div>어느 쪽으로도 권하지 않아요</div></div>'+
 '<p class="sub">결정은 언제나 당신의 몫이에요. 여기서는 생각을 정리하는 것만 도와요.</p>'+
 '<button class="pri" onclick="go(1)">편하게 시작하기</button>';
}

function ask(i){
 var q=Q[i],cur=S.a[q.k]||(q.multi?[]:null);
 var h='<div class="bar"><i style="width:'+((i+1)/Q.length*100)+'%"></i></div><h2>'+q.t+'</h2>';
 q.o.forEach(function(o,j){
  var on=q.multi?cur.indexOf(o)>-1:cur===o;
  h+='<button class="opt'+(on?' sel':'')+'" onclick="pick('+i+','+j+')">'+esc(o)+'</button>';
 });
 if(q.multi)h+='<button class="pri" onclick="go('+(S.step+1)+')">다음</button>';
 h+='<button class="ghost" onclick="go('+(S.step+1)+')">건너뛰기</button>';
 app.innerHTML=h;
}
function pick(i,j){
 var q=Q[i],v=q.o[j];
 if(q.multi){var c=S.a[q.k]||[],p=c.indexOf(v);if(p>-1)c.splice(p,1);else c.push(v);S.a[q.k]=c;save();ask(i)}
 else{S.a[q.k]=v;go(S.step+1);if(q.k==="safe"&&v!==q.o[0]){setTimeout(function(){document.getElementById("sos").showModal()},150)}}
}

// 첫 응답: 조언 없이, 사용자가 고른 말을 그대로 되돌려 준다 (짐작·단정 금지)
function mirror(){
 var a=S.a,p=[],unsure=["마음이 왔다 갔다 해요","아직 정리가 안 돼요"];
 if(a.feel){
  p.push("‘"+a.feel+"’라고 고르셨어요.");
  p.push(unsure.indexOf(a.feel)>-1?"이 단계에서는 아주 흔한 일이에요.":"그 마음을 그대로 두고, 천천히 살펴봐요.");
 }else p.push("아직 마음을 정하지 못했어도 괜찮아요.");
 var hard=(a.hard||[]).filter(function(x){return x!=="잘 모르겠어요"});
 if(hard.length)p.push("마음이 무거운 부분으로 "+hard.map(function(x){return"‘"+x+"’"}).join(", ")+"를 고르셨어요.");
 if(a.kids==="미성년 자녀가 있어요")p.push("아이가 함께 있어서 생각할 게 더 많겠어요.");
 p.push("정답을 바로 찾지 않아도 괜찮아요. 천천히 정리해 봐요.");
 var risk=a.safe&&a.safe!=="아니요";
 var safeBox=risk?'<div class="mirror" style="border:1px solid var(--warn)"><b>안전이 걱정된다고 하셨어요.</b><br>먼저 아래 연락처를 확인해 주세요.<br>112 · 1366 · 109<br><button class="ghost" onclick="sos.showModal()">자세히 보기</button></div>':"";
 app.innerHTML='<h2>들려줘서 고마워요</h2>'+safeBox+'<div class="mirror">'+p.map(esc).join("<br>")+'</div>'+
 '<p class="sub">어떻게 이어가고 싶으세요?</p>'+
 '<button class="opt" onclick="go('+(Q.length+3)+')">이야기를 더 해볼래요</button>'+
 '<button class="opt" onclick="go('+(Q.length+2)+')">선택지를 나란히 비교해 볼래요</button>'+
 '<button class="opt" onclick="go('+(Q.length+4)+')">오늘은 그냥 둘러볼게요</button>';
}

// 선택지 비교: 장점 3개·단점 3개씩 같은 개수로 보여줘 한쪽으로 기울지 않게 한다.
// 절차·기간(숙려기간 등)은 공개된 법률 정보 기준의 일반 안내이며, 출시 전 법원·전문가 검수가 필요하다.
var OPT=[
 {n:"이혼",
  legal:"법적 부부 관계가 끝나고, 재산·양육 문제를 정해야 해요.",
  proc:"서로 합의하면 협의이혼(법원 확인 후 신고해야 성립), 합의가 안 되면 조정·재판으로 가요. 협의이혼은 미성년 자녀가 있으면 3개월, 없거나 성년 자녀뿐이면 1개월의 숙려기간이 있어요(폭력 등 급박한 사정은 단축·면제될 수 있어요). 재판은 보통 6개월에서 1년 이상 걸려요.",
  pros:["오래 끌던 갈등과 불확실한 상태를 법적으로 정리할 수 있어요","양육·재산 문제를 문서나 판결로 정해 두면 이후의 기준이 생겨요","갈등이나 위험이 계속되는 환경에서 벗어날 수 있어요"],
  cons:["법적으로 되돌리기 어려워요. 다시 부부가 되려면 새로 혼인신고를 해야 해요","협의·조정·재판 과정에 시간과 비용, 감정 소모가 커요. 협의로 정한 재산 약속이 지켜지지 않아 다시 다투기도 해요","주거·생활비·아이와 보내는 시간 등 일상이 크게 바뀌어요"]},
 {n:"별거",
  legal:"법적으로는 여전히 부부이고, 생활만 따로 해요.",
  proc:"따로 정해진 법적 절차는 없어요. 생활비, 양육, 연락 방식, 기간을 서로 약속해 두는 것이 중요해요.",
  pros:["이혼보다 되돌리기 쉬워요","부딪히는 상황을 줄이고 생각할 시간을 가질 수 있어요","결정을 서두르지 않아도 돼요"],
  cons:["법적으로는 부부라서 재산·빚·상속 문제는 그대로예요","기한과 약속이 없으면 불확실한 상태가 길어질 수 있어요","두 집 살림으로 비용이 늘고, 아이가 있으면 일정 조율이 어려워요"]},
 {n:"관계 회복",
  legal:"법적인 변화 없이 관계를 이어가요.",
  proc:"정해진 절차는 없어요. 부부 상담, 가족 상담 등을 선택할 수 있어요.",
  pros:["가족과 생활 기반을 유지하면서 문제를 다룰 수 있어요","소통하는 방법을 배우면 이후의 갈등에도 도움이 될 수 있어요","아이에게 안정적인 환경을 이어줄 수 있어요(안전한 관계일 때)"],
  cons:["양쪽 모두의 노력이 필요해요. 한쪽만 원하면 어려울 수 있어요","시간이 걸리고, 결과가 보장되지는 않아요","폭력·위협이 있는 관계에서는 위험할 수 있고, 근본 문제를 덮고 가면 같은 갈등이 반복될 수 있어요"]}
];
function openCase(i){S.caseOpt=i;go(Q.length+5)}
function compare(){
 var a=S.a,hard=a.hard||[],kids=a.kids,years=a.years;
 function has(x){return hard.indexOf(x)>-1}
 var risk=a.safe&&a.safe!=="아니요";
 var chosen=[a.feel,years,kids].concat(hard).filter(function(x){return x&&x!=="잘 모르겠어요"&&x!=="말하고 싶지 않아요"});
 var q=[[],[],[]]; // 0=이혼, 1=별거, 2=관계 회복 (질문 형태로 써서 어느 쪽으로도 기울지 않게 함)
 if(kids==="미성년 자녀가 있어요"){
  q[0].push("아이의 양육은 어떻게 나누고 싶은가요? 아이에게 어떻게 설명할지 생각해 봤나요?");
  q[1].push("각자 어디서 지내고, 아이는 누구와 어떻게 만나게 할지 정해 볼 수 있을까요?");
  q[2].push("지금의 갈등을 아이가 어떻게 느끼고 있다고 생각하나요?");
 }
 if(kids==="자녀가 이미 성인이에요"){q[0].push("성인 자녀에게는 이 고민을 어떻게, 언제 이야기하고 싶은가요?")}
 if(has("돈 문제가 걱정돼요")){
  q[0].push("재산과 빚을 한 번 목록으로 정리해 본 적 있나요?");
  q[1].push("두 집 생활비를 감당할 수 있을지, 생활비는 어떻게 나눌지 이야기해 볼 수 있을까요?");
  q[2].push("돈 문제를 둘이 편하게 이야기할 수 있는 방법이 있을까요?");
 }
 if(has("믿음이 흔들렸어요")){
  q[0].push("믿음이 깨진 일이 앞으로 풀릴 수 있을 것 같나요, 아니면 정리가 필요하다고 느끼나요?");
  q[2].push("믿음을 다시 쌓으려면 상대에게 무엇이 필요하다고 느끼나요? 상대도 같은 마음일까요?");
 }
 if(has("대화가 잘 안 돼요")||has("자주 부딪혀요")){
  q[1].push("떨어져 지내는 동안 연락과 만남은 어떻게 할지 정해 볼 수 있을까요?");
  q[2].push("대화가 막히는 순간은 주로 언제인가요? 제3자(상담)가 함께 있으면 어떨까요?");
 }
 if(has("외롭고 지쳐요")){q[0].push("이혼 뒤에 기대하는 변화와 걱정되는 변화는 각각 무엇인가요?")}
 if(years==="15년 이상"){q[0].push("오래 함께한 만큼 재산, 주거, 연금 등 정리할 것이 많을 수 있어요. 어떤 것부터 확인해 볼까요?")}
 if(!q[0].length)q[0].push("이혼하고 1년 뒤, 무엇이 달라져 있길 바라나요?");
 if(!q[1].length)q[1].push("언제쯤 다시 생각해 볼지 기한을 정해 둘 수 있을까요?");
 if(!q[2].length)q[2].push("관계가 나아졌다고 느낄 수 있는 모습은 어떤 건가요?");

 var h='<h2>세 가지 선택지, 같은 기준으로</h2>';
 if(risk)h+='<div class="mirror" style="border:1px solid var(--warn)"><b>안전이 먼저예요.</b><br>어떤 선택을 하든 안전이 가장 우선이에요. 폭력이나 위협이 있는 관계에서는 관계 회복 노력보다 안전 확보가 먼저예요.<br>112 · 1366 · 109<button class="ghost" onclick="sos.showModal()">자세히 보기</button></div>';
 h+=chosen.length
  ?'<p class="sub">고르신 답변(‘'+chosen.map(esc).join("’, ‘")+'’)에 맞춰 질문을 달리 보여드려요. 점수나 추천은 없어요.</p>'
  :'<p class="sub">아직 고른 답변이 없어서 일반적인 질문을 보여드려요. 점수나 추천은 없어요.</p>';
 function li(sign,t){return'<dd>'+sign+' '+t+'</dd>'}
 OPT.forEach(function(x,i){
  h+='<div class="cmp"><h3>'+x.n+'</h3><dl>'+
   '<dt>법적 상태</dt><dd>'+x.legal+'</dd>'+
   '<dt>절차</dt><dd>'+x.proc+'</dd>'+
   '<dt>장점</dt>'+x.pros.map(function(t){return li("＋",t)}).join("")+
   '<dt>단점</dt>'+x.cons.map(function(t){return li("－",t)}).join("")+
   '<dt>내 상황에서 생각해 볼 질문</dt>'+q[i].map(function(t){return li("·",esc(t))}).join("")+
   '</dl><button class="opt" style="margin:12px 0 0" onclick="openCase('+i+')">'+x.n+' 사례 보기 →</button></div>';
 });
 h+='<p class="sub">절차와 기간은 공개된 법률 정보를 바탕으로 한 일반 안내이고 바뀔 수 있어요. 어느 쪽이 맞는지는 이 화면이 정하지 않아요. 결정 전에 법원이나 대한법률구조공단(132) 같은 곳에 확인해 주세요.</p>'+
 '<button class="pri" onclick="go('+(Q.length+3)+')">이야기를 더 해볼래요</button><button class="ghost" onclick="back()">뒤로</button>';
 app.innerHTML=h;
}

// 사례: 실제 인물이 아닌 가상 사례. 각 선택지마다 '잘 풀린 경우'와 '어려웠던 경우'를 함께 보여 균형을 맞춘다.

var CASES=[
 [{t:"오랜 갈등 끝에 협의이혼한 경우",s:"결혼 12년, 초등학생 자녀 1명. 몇 년째 대화가 거의 없고 다툼이 반복됐어요.",c:"숙려기간 동안 양육 방식과 양육비를 문서로 정리하고 협의이혼을 했어요.",h:"아이에게 설명하는 일과, 이사로 달라진 생활이 힘들었어요.",r:"첫해는 불안했지만 집안의 긴장이 줄었고, 정해 둔 면접 일정으로 아이와의 생활이 안정돼 갔어요."},
  {t:"서둘러 정리했다가 다시 다툰 경우",s:"큰 다툼 직후 감정이 격해진 상태에서 이혼을 결정했어요.",c:"재산 목록을 정리하지 않고 구두로만 합의한 채 서둘러 진행했어요.",h:"나중에 재산과 빚의 범위를 두고 의견이 갈렸어요.",r:"합의를 문서로 남기지 않아 다시 조정 절차를 밟게 됐고, 시간과 비용이 더 들었어요."}],
 [{t:"기한을 정해 떨어져 지낸 경우",s:"결혼 8년, 자녀 없음. 서로 많이 지쳐 있었어요.",c:"6개월 기한을 정하고, 생활비와 연락 방식을 약속한 뒤 따로 지냈어요.",h:"처음엔 연락 횟수를 두고 서로 서운함이 있었어요.",r:"기한이 끝날 무렵 각자의 마음을 이야기했고, 함께 상담을 받아 보기로 했어요."},
  {t:"기한 없이 길어진 경우",s:"결혼 15년, 중학생 자녀 1명. 일단 따로 살기로 했어요.",c:"기간이나 생활비 약속 없이 시작했어요.",h:"두 집 생활비 부담이 커지고, 아이 일정 조율이 매번 다툼이 됐어요.",r:"2년이 지나서야 앞으로의 방향을 정리하는 대화를 시작했어요."}],
 [{t:"부부 상담을 함께 받은 경우",s:"결혼 6년, 대화가 늘 다툼으로 끝났어요.",c:"함께 부부 상담을 받고, 대화가 격해지면 잠시 쉬는 규칙을 정했어요.",h:"상담 초반에는 서로 지적받는 느낌이라 불편했어요.",r:"갈등이 사라지진 않았지만 다투는 방식이 달라졌다고 느꼈어요."},
  {t:"한쪽만 노력한 경우",s:"한쪽은 관계를 이어가길 원했지만, 상대는 확신이 없었어요.",c:"원하는 쪽이 혼자 노력하며 기다렸어요.",h:"변화가 보이지 않아 지치고 외로움이 커졌어요.",r:"몇 달 뒤, 서로의 생각을 솔직하게 나누는 자리를 만들어 보기로 했어요."}]
];
function cases(){
 var i=S.caseOpt||0,names=["이혼","별거","관계 회복"];
 var h='<h2>사례 보기</h2><p class="sub">실제 인물이 아니라, 일반적으로 알려진 상황을 바탕으로 만든 <b>가상 사례</b>예요. 결과는 사람마다 달라서, 잘 풀린 경우와 어려웠던 경우를 함께 보여드려요.</p>';
 h+='<div style="display:flex;gap:8px;margin:12px 0">'+names.map(function(n,j){return'<button class="opt'+(j===i?' sel':'')+'" style="margin:0;width:auto;flex:1;text-align:center;padding:10px 4px" onclick="S.caseOpt='+j+';save();cases()">'+n+'</button>'}).join("")+'</div>';
 CASES[i].forEach(function(c){
  h+='<div class="cmp"><h3>'+c.t+'</h3><dl><dt>상황</dt><dd>'+c.s+'</dd><dt>선택</dt><dd>'+c.c+'</dd><dt>어려웠던 점</dt><dd>'+c.h+'</dd><dt>그 뒤</dt><dd>'+c.r+'</dd></dl></div>';
 });
 h+='<p class="sub">폭력이나 위협이 있는 상황은 이 사례에 해당하지 않아요. 그런 경우에는 안전이 먼저예요(112 · 1366).</p><button class="ghost" onclick="back()">← 비교로 돌아가기</button>';
