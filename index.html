<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>쉼표</title>
<meta name="theme-color" content="#4f7a6a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쉼표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#2a2a28;--sub:#6b6a66;--ac:#4f7a6a;--acbg:#e3eee9;--bd:#e2dfd6;--warn:#b4492f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1d1b;--card:#262826;--tx:#ecebe6;--sub:#a3a29b;--ac:#8fc0ad;--acbg:#2c3a35;--bd:#3a3c38;--warn:#e58a72}}
:root[data-theme="dark"]{--bg:#1c1d1b;--card:#262826;--tx:#ecebe6;--sub:#a3a29b;--ac:#8fc0ad;--acbg:#2c3a35;--bd:#3a3c38;--warn:#e58a72}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:480px;margin:0 auto;padding:24px 20px 96px}
h1{font-size:26px;margin:32px 0 8px}h2{font-size:20px;margin:24px 0 12px;line-height:1.4}
p{margin:0 0 12px}.sub{color:var(--sub);font-size:14px}
.promise{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px 16px;margin:20px 0}
.promise div{padding:10px 0;border-bottom:1px solid var(--bd)}.promise div:last-child{border:0}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:0 0 10px}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.pri{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;margin-top:16px;font-weight:600}
:root[data-theme="dark"] .pri,:root:not([data-theme="light"]) .pri{color:#10201a}
.ghost{background:none;border:0;color:var(--sub);padding:12px 0;text-decoration:underline;font-size:14px}
.bar{height:4px;background:var(--bd);border-radius:2px;margin-bottom:8px}.bar i{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .3s}
.mirror{background:var(--acbg);border-radius:14px;padding:16px;margin:12px 0 20px}
.cmp{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.cmp h3{margin:0 0 8px;font-size:17px}.cmp dt{font-size:12px;color:var(--sub);margin-top:8px}.cmp dd{margin:0}
.dock{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--bd)}
.dock button{background:none;border:0;font-size:13px;color:var(--sub);padding:6px 4px}
.dock .sos{color:var(--warn);font-weight:600}
dialog{border:1px solid var(--bd);border-radius:16px;background:var(--card);color:var(--tx);max-width:420px;width:calc(100% - 32px);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:10px;background:var(--acbg);color:var(--ac);margin:0 4px 4px 0}
</style>
</head>
<body>
<main id="app"></main>
<div class="dock">
  <button class="sos" onclick="sos.showModal()">긴급 도움</button>
  <button id="backBtn" onclick="back()" style="visibility:hidden">← 이전</button>
  <button onclick="restart()">처음으로</button>
  <button onclick="wipe()">기록 모두 삭제</button>
</div>

<dialog id="sos">
  <h2 style="margin-top:0">지금 안전이 걱정된다면</h2>
  <p>폭력이나 위협이 있거나 스스로를 해칠 것 같다면 먼저 아래로 연락해 주세요.</p>
  <p><b>112</b> 긴급 신고<br><b>1366</b> 여성긴급전화(24시간)<br><b>109</b> 자살예방 상담전화</p>
  <button class="pri" onclick="sos.close()">닫기</button>
</dialog>

<dialog id="exp">
  <h2 style="margin-top:0">내보내기</h2>
  <p class="sub">내용을 복사했어요. 복사가 안 됐다면 아래 글을 길게 눌러 전체 선택 후 복사하세요. 저장소의 posts.json을 열어 내용을 모두 지우고 붙여 넣은 뒤 Commit하면 모든 사용자에게 반영돼요.</p>
  <textarea id="expText" rows="10" readonly style="width:100%;border:1px solid var(--bd);border-radius:12px;padding:10px;background:var(--bg);color:var(--tx);font:13px/1.4 monospace"></textarea>
  <button class="pri" onclick="document.getElementById('exp').close()">닫기</button>
</dialog>

<script>
// 앱 상태: 서버로 전송하지 않고 이 기기(localStorage)에만 저장한다는 약속을 코드로도 지킨다.
var KEY="shwimpyo.v1", S={step:0,a:{}};
try{var raw=localStorage.getItem(KEY);if(raw)S=JSON.parse(raw)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function wipe(){if(!confirm("이 기기에 저장된 기록을 모두 지울까요?"))return;try{localStorage.removeItem(KEY)}catch(e){}S={step:0,a:{},hist:[]};render()}
function restart(){S.step=0;S.a={};S.hist=[];save();render()}

// 질문 정의: 모든 질문에 '잘 모르겠어요'와 '건너뛰기'를 둔다 (자유 서술은 요구하지 않음)
var Q=[
 {k:"feel",t:"요즘 마음에 가장 가까운 건 어느 쪽인가요?",o:["이혼 쪽으로 마음이 기울어요","잠시 떨어져 지내고 싶어요","관계를 다시 이어가고 싶어요","마음이 왔다 갔다 해요","아직 정리가 안 돼요"]},
 {k:"years",t:"함께한 시간은 어느 정도인가요?",o:["5년 미만","5~15년","15년 이상","말하고 싶지 않아요"]},
 {k:"kids",t:"함께 돌보는 아이가 있나요?",o:["미성년 자녀가 있어요","자녀가 이미 성인이에요","없어요","말하고 싶지 않아요"]},
 {k:"hard",t:"요즘 가장 마음이 무거운 부분은요? (여러 개 골라도 돼요)",multi:1,o:["자주 부딪혀요","믿음이 흔들렸어요","대화가 잘 안 돼요","돈 문제가 걱정돼요","외롭고 지쳐요","아이가 걱정돼요","잘 모르겠어요"]},
 // 안전 확인: 첫 번째 선택지("아니요") 외를 고르면 긴급 안내를 먼저 보여준다 (pick() 참고)
 {k:"safe",t:"혹시 지금 안전이 걱정되는 일이 있나요?",o:["아니요","조금 불안해요","네, 안전이 걱정돼요"]}
];
var app=document.getElementById("app");
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function renderStep(){
 if(S.step===0)return intro();
 if(S.step<=Q.length)return ask(S.step-1);
 if(S.step===Q.length+1)return mirror();
 if(S.step===Q.length+2)return compare();
 if(S.step===Q.length+3)return talk();
 if(S.step===Q.length+4)return browse();
 if(S.step===Q.length+5)return cases();
 if(S.step===Q.length+6)return stories();
 if(S.step===Q.length+7)return story();
 if(S.step===Q.length+8)return editor();
}
function render(){renderStep();updateDock()}
function go(n){
 if(S.step!==n){S.hist=S.hist||[];S.hist.push(S.step)} // 이전으로 돌아갈 수 있도록 현재 단계 기록
 S.step=n;save();render();window.scrollTo(0,0)
}
function back(){
 var h=S.hist||[];if(!h.length)return;
 S.step=h.pop();save();render();window.scrollTo(0,0)
}
// 이전 버튼은 돌아갈 곳이 있을 때만 보이게 한다
function updateDock(){var b=document.getElementById("backBtn");if(b)b.style.visibility=(S.hist&&S.hist.length)?"visible":"hidden"}

function intro(){
 app.innerHTML='<h1>쉼표</h1><p class="sub">마음을 정리하는 잠깐의 쉼</p>'+
 '<div class="promise"><div>이름·연락처는 묻지 않아요</div><div>내용은 이 기기에만 저장돼요</div><div>어느 쪽으로도 권하지 않아요</div></div>'+
 '<p class="sub">결정은 언제나 당신의 몫이에요. 여기서는 생각을 정리하는 것만 도와요.</p>'+
 '<button class="pri" onclick="go(1)">편하게 시작하기</button><button class="ghost" style="width:100%;text-align:center" onclick="go(Q.length+6)">이야기 둘러보기</button><p class="sub" style="margin-top:20px;text-align:center">시험 버전 v7</p>';
}

function ask(i){
 var q=Q[i],cur=S.a[q.k]||(q.multi?[]:null);
 var h='<div class="bar"><i style="width:'+((i+1)/Q.length*100)+'%"></i></div><h2>'+q.t+'</h2>';
 q.o.forEach(function(o,j){
  var on=q.multi?cur.indexOf(o)>-1:cur===o;
  h+='<button class="opt'+(on?' sel':'')+'" onclick="pick('+i+','+j+')">'+esc(o)+'</button>';
 });
 if(q.multi)h+='<button class="pri" onclick="go('+(S.step+1)+')">다음</button>';
 h+='<button class="ghost" onclick="go('+(S.step+1)+')">건너뛰기</button>';
 app.innerHTML=h;
}
function pick(i,j){
 var q=Q[i],v=q.o[j];
 if(q.multi){var c=S.a[q.k]||[],p=c.indexOf(v);if(p>-1)c.splice(p,1);else c.push(v);S.a[q.k]=c;save();ask(i)}
 else{S.a[q.k]=v;go(S.step+1);if(q.k==="safe"&&v!==q.o[0]){setTimeout(function(){document.getElementById("sos").showModal()},150)}}
}

// 첫 응답: 조언 없이, 사용자가 고른 말을 그대로 되돌려 준다 (짐작·단정 금지)
function mirror(){
 var a=S.a,p=[],unsure=["마음이 왔다 갔다 해요","아직 정리가 안 돼요"];
 if(a.feel){
  p.push("‘"+a.feel+"’라고 고르셨어요.");
  p.push(unsure.indexOf(a.feel)>-1?"이 단계에서는 아주 흔한 일이에요.":"그 마음을 그대로 두고, 천천히 살펴봐요.");
 }else p.push("아직 마음을 정하지 못했어도 괜찮아요.");
 var hard=(a.hard||[]).filter(function(x){return x!=="잘 모르겠어요"});
 if(hard.length)p.push("마음이 무거운 부분으로 "+hard.map(function(x){return"‘"+x+"’"}).join(", ")+"를 고르셨어요.");
 if(a.kids==="미성년 자녀가 있어요")p.push("아이가 함께 있어서 생각할 게 더 많겠어요.");
 p.push("정답을 바로 찾지 않아도 괜찮아요. 천천히 정리해 봐요.");
 var risk=a.safe&&a.safe!=="아니요";
 var safeBox=risk?'<div class="mirror" style="border:1px solid var(--warn)"><b>안전이 걱정된다고 하셨어요.</b><br>먼저 아래 연락처를 확인해 주세요.<br>112 · 1366 · 109<br><button class="ghost" onclick="sos.showModal()">자세히 보기</button></div>':"";
 app.innerHTML='<h2>들려줘서 고마워요</h2>'+safeBox+'<div class="mirror">'+p.map(esc).join("<br>")+'</div>'+
 '<p class="sub">어떻게 이어가고 싶으세요?</p>'+
 '<button class="opt" onclick="go('+(Q.length+3)+')">이야기를 더 해볼래요</button>'+
 '<button class="opt" onclick="go('+(Q.length+2)+')">선택지를 나란히 비교해 볼래요</button>'+
 '<button class="opt" onclick="go('+(Q.length+6)+')">내 상황에 맞는 이야기를 읽어볼래요</button>'+
 '<button class="opt" onclick="go('+(Q.length+4)+')">오늘은 그냥 둘러볼게요</button>';
}

// 선택지 비교: 장점 3개·단점 3개씩 같은 개수로 보여줘 한쪽으로 기울지 않게 한다.
// 절차·기간(숙려기간 등)은 공개된 법률 정보 기준의 일반 안내이며, 출시 전 법원·전문가 검수가 필요하다.
var OPT=[
 {n:"이혼",
  legal:"법적 부부 관계가 끝나고, 재산·양육 문제를 정해야 해요.",
  proc:"서로 합의하면 협의이혼(법원 확인 후 신고해야 성립), 합의가 안 되면 조정·재판으로 가요. 협의이혼은 미성년 자녀가 있으면 3개월, 없거나 성년 자녀뿐이면 1개월의 숙려기간이 있어요(폭력 등 급박한 사정은 단축·면제될 수 있어요). 재판은 보통 6개월에서 1년 이상 걸려요.",
  pros:["오래 끌던 갈등과 불확실한 상태를 법적으로 정리할 수 있어요","양육·재산 문제를 문서나 판결로 정해 두면 이후의 기준이 생겨요","갈등이나 위험이 계속되는 환경에서 벗어날 수 있어요"],
  cons:["법적으로 되돌리기 어려워요. 다시 부부가 되려면 새로 혼인신고를 해야 해요","협의·조정·재판 과정에 시간과 비용, 감정 소모가 커요. 협의로 정한 재산 약속이 지켜지지 않아 다시 다투기도 해요","주거·생활비·아이와 보내는 시간 등 일상이 크게 바뀌어요"]},
 {n:"별거",
  legal:"법적으로는 여전히 부부이고, 생활만 따로 해요.",
  proc:"따로 정해진 법적 절차는 없어요. 생활비, 양육, 연락 방식, 기간을 서로 약속해 두는 것이 중요해요.",
  pros:["이혼보다 되돌리기 쉬워요","부딪히는 상황을 줄이고 생각할 시간을 가질 수 있어요","결정을 서두르지 않아도 돼요"],
  cons:["법적으로는 부부라서 재산·빚·상속 문제는 그대로예요","기한과 약속이 없으면 불확실한 상태가 길어질 수 있어요","두 집 살림으로 비용이 늘고, 아이가 있으면 일정 조율이 어려워요"]},
 {n:"관계 회복",
  legal:"법적인 변화 없이 관계를 이어가요.",
  proc:"정해진 절차는 없어요. 부부 상담, 가족 상담 등을 선택할 수 있어요.",
  pros:["가족과 생활 기반을 유지하면서 문제를 다룰 수 있어요","소통하는 방법을 배우면 이후의 갈등에도 도움이 될 수 있어요","아이에게 안정적인 환경을 이어줄 수 있어요(안전한 관계일 때)"],
  cons:["양쪽 모두의 노력이 필요해요. 한쪽만 원하면 어려울 수 있어요","시간이 걸리고, 결과가 보장되지는 않아요","폭력·위협이 있는 관계에서는 위험할 수 있고, 근본 문제를 덮고 가면 같은 갈등이 반복될 수 있어요"]}
];
function openCase(i){S.caseOpt=i;go(Q.length+5)}
function compare(){
 var a=S.a,hard=a.hard||[],kids=a.kids,years=a.years;
 function has(x){return hard.indexOf(x)>-1}
 var risk=a.safe&&a.safe!=="아니요";
 var chosen=[a.feel,years,kids].concat(hard).filter(function(x){return x&&x!=="잘 모르겠어요"&&x!=="말하고 싶지 않아요"});
 var q=[[],[],[]]; // 0=이혼, 1=별거, 2=관계 회복 (질문 형태로 써서 어느 쪽으로도 기울지 않게 함)
 if(kids==="미성년 자녀가 있어요"){
  q[0].push("아이의 양육은 어떻게 나누고 싶은가요? 아이에게 어떻게 설명할지 생각해 봤나요?");
  q[1].push("각자 어디서 지내고, 아이는 누구와 어떻게 만나게 할지 정해 볼 수 있을까요?");
  q[2].push("지금의 갈등을 아이가 어떻게 느끼고 있다고 생각하나요?");
 }
 if(kids==="자녀가 이미 성인이에요"){q[0].push("성인 자녀에게는 이 고민을 어떻게, 언제 이야기하고 싶은가요?")}
 if(has("돈 문제가 걱정돼요")){
  q[0].push("재산과 빚을 한 번 목록으로 정리해 본 적 있나요?");
  q[1].push("두 집 생활비를 감당할 수 있을지, 생활비는 어떻게 나눌지 이야기해 볼 수 있을까요?");
  q[2].push("돈 문제를 둘이 편하게 이야기할 수 있는 방법이 있을까요?");
 }
 if(has("믿음이 흔들렸어요")){
  q[0].push("믿음이 깨진 일이 앞으로 풀릴 수 있을 것 같나요, 아니면 정리가 필요하다고 느끼나요?");
  q[2].push("믿음을 다시 쌓으려면 상대에게 무엇이 필요하다고 느끼나요? 상대도 같은 마음일까요?");
 }
 if(has("대화가 잘 안 돼요")||has("자주 부딪혀요")){
  q[1].push("떨어져 지내는 동안 연락과 만남은 어떻게 할지 정해 볼 수 있을까요?");
  q[2].push("대화가 막히는 순간은 주로 언제인가요? 제3자(상담)가 함께 있으면 어떨까요?");
 }
 if(has("외롭고 지쳐요")){q[0].push("이혼 뒤에 기대하는 변화와 걱정되는 변화는 각각 무엇인가요?")}

   n:"관계를 회복해서 소송까지 가지 않은 경우는 판결문에 남지 않아요. 그래서 ‘회복에 성공한 실제 사례’는 판례로는 확인하기 어려워요.",
   u:"https://www.lawtimes.co.kr/news/articleView.html?idxno=180819",src:"법률신문 판례평석"}]
];
function realCard(c){
 return '<div class="cmp"><h3>'+c.t+'</h3><p class="sub" style="margin:0 0 6px">'+c.c+'</p><dl>'+
  '<dt>어떤 사건이었나</dt>'+c.s.map(function(x){return'<dd>· '+x+'</dd>'}).join("")+
  '<dt>쟁점</dt><dd>'+c.q+'</dd><dt>법원의 판단</dt><dd>'+c.d+'</dd>'+
  '<dt>이 판례가 보여주는 점</dt><dd>'+c.k+'</dd>'+(c.n?'<dt>알아둘 점</dt><dd>'+c.n+'</dd>':'')+
  '</dl><a href="'+c.u+'" target="_blank" rel="noopener" style="font-size:14px;color:var(--ac)">출처: '+c.src+' ↗</a></div>';
}
function cases(){
 var i=S.caseOpt||0,names=["이혼","별거","관계 회복"];
 var h='<h2>실제 판례·사례</h2><p class="sub">법원에서 공개된 판결을 쉬운 말로 풀어 쓴 내용이에요. 당사자 이름은 판결문에서 이미 가려져 있고, 이 앱도 쓰지 않아요.</p>'+
  '<div class="mirror" style="font-size:14px">판례는 <b>법원까지 간 분쟁</b>만 담고 있어서, 협의로 끝났거나 관계를 회복한 경우는 거의 보이지 않아요. 그래서 아래 사례가 보통의 경우를 대표하지는 않아요. 법률 자문이 아니며, 결과는 사건마다 달라요.</div>';
 h+='<div style="display:flex;gap:8px;margin:12px 0">'+names.map(function(n,j){return'<button class="opt'+(j===i?' sel':'')+'" style="margin:0;width:auto;flex:1;text-align:center;padding:10px 4px" onclick="S.caseOpt='+j+';save();cases()">'+n+'</button>'}).join("")+'</div>';
 REAL[i].forEach(function(c){h+=realCard(c)});
 h+='<details class="cmp"><summary style="cursor:pointer;font-weight:600">일반적인 상황으로 만든 가상 사례도 볼래요</summary><p class="sub" style="margin-top:8px">실제 인물이 아닌 가상 사례예요.</p>';
 CASES[i].forEach(function(c){
  h+='<h3 style="margin-top:12px">'+c.t+'</h3><dl><dt>상황</dt><dd>'+c.s+'</dd><dt>선택</dt><dd>'+c.c+'</dd><dt>어려웠던 점</dt><dd>'+c.h+'</dd><dt>그 뒤</dt><dd>'+c.r+'</dd></dl>';
 });
 h+='</details><p class="sub">폭력이나 위협이 있는 상황은 이 사례들에 해당하지 않아요. 그런 경우에는 안전이 먼저예요(112 · 1366).</p><button class="ghost" onclick="back()">← 비교로 돌아가기</button>';
 app.innerHTML=h;
}

// 상담 화면은 자리표시자: 실제 AI 상담은 백엔드(Spring Boot)에서 모델을 호출해 연결한다.
function talk(){
 app.innerHTML='<h2>천천히 이야기해 보세요</h2><p class="sub">AI 상담은 다음 단계에서 연결할 자리예요. 지금은 마음에 있는 한 줄을 적어 두는 메모로 동작해요. 이 기기에서만 보여요.</p>'+
 '<textarea id="memo" rows="6" style="width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);color:var(--tx);font:inherit" placeholder="적고 싶을 때만 적어요">'+esc(S.memo||"")+'</textarea>'+
 '<button class="pri" onclick="S.memo=document.getElementById(\'memo\').value;save();back()">저장하고 돌아가기</button>';
}
function browse(){
 app.innerHTML='<h2>천천히 둘러보세요</h2><button class="opt" onclick="go('+(Q.length+2)+')">세 가지 선택지 비교</button><button class="opt" onclick="go('+(Q.length+3)+')">마음 메모 쓰기</button><button class="opt" onclick="go('+(Q.length+6)+')">이야기 읽기</button><button class="ghost" onclick="back()">뒤로</button>';
}
// ===== 이야기(글) 기능: 운영자가 글을 올리고, 사용자의 답변에 맞는 글을 먼저 보여준다 =====
// 글 데이터는 저장소의 posts.json에서 읽는다(서버 없이 무료 운영). 관리자는 이 기기에서 쓰고 고친 뒤 '내보내기'로 posts.json에 반영한다.
// 실서비스에서는 이 부분이 서버 API(관리자 로그인 + 게시글 테이블)로 바뀐다.
var TAGS=[["all","모두에게"],["f1","이혼 쪽으로 기울어요"],["f2","잠시 떨어지고 싶어요"],["f3","관계를 이어가고 싶어요"],["f4","마음이 왔다 갔다 해요"],["f5","아직 정리가 안 돼요"],["h1","자주 부딪혀요"],["h2","믿음이 흔들렸어요"],["h3","대화가 안 돼요"],["h4","돈 문제"],["h5","외롭고 지쳐요"],["h6","아이가 걱정돼요"],["k1","미성년 자녀"]];
function tagLabel(c){for(var i=0;i<TAGS.length;i++)if(TAGS[i][0]===c)return TAGS[i][1];return c}
var SEED=[{"id": "sample1", "title": "화가 올라올 때, 10분만 멈춰 보기", "tags": ["h1", "h3"], "updatedAt": 1794177702898, "body": "말다툼이 커질 때는 이기려고 하기보다 잠깐 멈추는 게 도움이 될 때가 있어요.\n‘지금 너무 격해졌어. 10분 뒤에 다시 얘기하자’처럼 말하고 자리를 떠 보세요. 상대를 피하는 게 아니라, 다시 돌아오겠다는 약속이 함께 있어야 해요.\n돌아와서는 ‘너는 항상 그래’보다 ‘나는 이럴 때 속상했어’처럼 내 감정을 중심으로 말해 보세요. 비난이 줄면 대화가 이어질 가능성이 커져요.\n다만 폭력이나 위협이 있는 상황에서는 이 방법이 맞지 않아요. 그럴 땐 안전이 먼저예요."}, {"id": "sample2", "title": "마음이 흔들릴 때, 종이 한 장으로 정리하기", "tags": ["f4", "f5", "h5"], "updatedAt": 1794177702897, "body": "결정을 내리지 못하는 날에는 결정을 미뤄도 괜찮아요. 대신 종이 한 장에 세 가지를 적어 보세요.\n① 지금 가장 힘든 것 ② 꼭 지키고 싶은 것 ③ 앞으로 달라지길 바라는 것\n정답을 찾으려 하지 말고, 떠오르는 대로 적기만 하세요. 며칠 뒤에 다시 읽으면 마음이 조금 정리돼 보일 수 있어요.\n혼자 감당하기 벅차다면 믿을 수 있는 사람이나 전문 상담을 찾아보는 것도 좋아요."}, {"id": "sample3", "title": "아이 앞에서 지키고 싶은 작은 약속들", "tags": ["h6", "k1"], "updatedAt": 1794177702896, "body": "부부 사이가 힘들 때 아이는 말하지 않아도 분위기를 느껴요.\n아이 앞에서 서로를 깎아내리는 말은 줄이고, 아이에게 ‘이건 네 잘못이 아니야’라고 분명히 말해 주세요.\n아이의 일정과 생활 규칙은 가능한 한 지켜 주세요. 달라지는 게 있다면 미리, 아이 눈높이에 맞춰 설명해 주는 게 좋아요.\n어떤 선택을 하더라도 아이에게 안정감을 주는 일은 계속 할 수 있어요."}];
var POSTS=null,EDIT=null,PKEY="shwimpyo.posts.v1",ADMIN=false;
// 관리자 모드: 주소 뒤에 ?admin=1 을 붙여 한 번 열면 이 기기에서 켜지고, ?admin=0 으로 끈다.
// 이 모드의 수정은 그 기기에만 저장되므로 다른 사용자에게는 영향이 없다(실서버에서는 로그인 인증 필요).
try{var qs=location.search;if(qs.indexOf("admin=1")>-1)localStorage.setItem("shwimpyo.admin","1");if(qs.indexOf("admin=0")>-1)localStorage.removeItem("shwimpyo.admin");ADMIN=localStorage.getItem("shwimpyo.admin")==="1"}catch(e){}
function localPosts(){try{var r=localStorage.getItem(PKEY);return r?JSON.parse(r):null}catch(e){return null}}
function savePosts(){try{localStorage.setItem(PKEY,JSON.stringify(POSTS))}catch(e){}}
function loadPosts(done){
 var lp=ADMIN?localPosts():null;            // 관리자는 이 기기의 수정본을 우선 사용
 if(lp){POSTS=lp;done();return}
 fetch("posts.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){POSTS=Array.isArray(j)?j:SEED.slice();done()}).catch(function(){POSTS=SEED.slice();done()});
}
// 사용자의 답변을 글 카테고리 코드로 바꾼다 (f=마음, h=힘든 것, k=자녀)
function userTags(){
 var a=S.a,t=[],fi=Q[0].o.indexOf(a.feel);
 if(fi>-1)t.push("f"+(fi+1));
 (a.hard||[]).forEach(function(x){var i=Q[3].o.indexOf(x);if(i>-1&&i<6)t.push("h"+(i+1))});
 if(a.kids==="미성년 자녀가 있어요")t.push("k1");
 return t;
}
// 맞는 카테고리 하나당 1점, '모두에게'는 0.5점. 점수가 높은 글을 먼저 보여준다.
function score(p,ut){var s=0;(p.tags||[]).forEach(function(c){if(ut.indexOf(c)>-1)s+=1;else if(c==="all")s+=0.5});return s}
function findPost(id){var L=POSTS||[];for(var i=0;i<L.length;i++)if(L[i].id===id)return L[i];return null}
function chips(tags){return(tags||[]).map(function(c){return'<span class="chip">'+esc(tagLabel(c))+'</span>'}).join("")}
function preview(b){var t=String(b||"").replace(/\s+/g," ");return t.length>60?t.slice(0,60)+"…":t}
function postCard(p){
 var adm=ADMIN?'<div style="display:flex;gap:16px;margin-top:6px"><button class="ghost" style="padding:4px 0" onclick="event.stopPropagation();editPost(\''+p.id+'\')">수정</button><button class="ghost" style="padding:4px 0;color:var(--warn)" onclick="event.stopPropagation();deletePost(\''+p.id+'\')">삭제</button></div>':"";
 return'<div class="cmp" style="cursor:pointer" onclick="openStory(\''+p.id+'\')"><h3>'+esc(p.title)+'</h3><p class="sub" style="margin:0 0 8px">'+esc(preview(p.body))+'</p>'+chips(p.tags)+adm+'</div>';
}
function adminBar(){
 return'<div class="mirror" style="font-size:14px"><b>관리자 모드</b> · 수정 내용은 이 기기에만 저장돼요.<br>다른 사용자에게 보이려면 ‘내보내기’ 내용을 저장소의 posts.json에 붙여 넣고 Commit해 주세요.</div>'+
  '<button class="pri" style="margin-top:0" onclick="newPost()">＋ 새 글 쓰기</button>'+
  '<div style="display:flex;gap:8px;margin-top:10px"><button class="opt" style="margin:0;width:auto;flex:1;text-align:center" onclick="exportPosts()">내보내기</button><button class="opt" style="margin:0;width:auto;flex:1;text-align:center" onclick="pullPublished()">공개된 글 불러오기</button></div>';
}
function stories(){
 if(!POSTS){app.innerHTML='<p class="sub">불러오는 중…</p>';loadPosts(function(){if(S.step===Q.length+6)stories()});return}
 var ut=userTags(),h='<h2>이야기</h2><p class="sub">운영자가 직접 쓰거나 고른 글이에요. 전문가의 상담이나 법률 자문은 아니에요.</p>';
 if(ADMIN)h+=adminBar();
 var sorted=POSTS.slice().sort(function(a,b){return score(b,ut)-score(a,ut)||(b.updatedAt||0)-(a.updatedAt||0)});
 var matched=sorted.filter(function(p){return score(p,ut)>=1}),rest=sorted.filter(function(p){return score(p,ut)<1});
 var saved=(S.saved||[]).map(findPost).filter(Boolean);
 function sec(t,arr){return arr.length?'<h3 style="margin:20px 0 10px;font-size:16px">'+t+'</h3>'+arr.map(postCard).join(""):""}
 if(!POSTS.length)h+='<p class="sub" style="margin-top:16px">아직 올라온 글이 없어요.</p>';
 h+=sec("내 상황과 비슷한 글",ut.length?matched:[])+sec("저장한 글",saved)+sec(ut.length&&matched.length?"다른 글":"모든 글",ut.length?rest:sorted);
 h+='<button class="ghost" onclick="back()">뒤로</button>';
 app.innerHTML=h;
}
function openStory(id){S.openId=id;go(Q.length+7)}
function story(){
 if(!POSTS){loadPosts(function(){story()});return}
 var p=findPost(S.openId);
 if(!p){app.innerHTML='<p class="sub">글을 찾을 수 없어요.</p><button class="ghost" onclick="back()">뒤로</button>';return}
 var saved=(S.saved||[]).indexOf(p.id)>-1,d=p.updatedAt?new Date(p.updatedAt):null;
 var date=d?d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2):"";
 app.innerHTML='<h2>'+esc(p.title)+'</h2><div>'+chips(p.tags)+'</div>'+(date?'<p class="sub">'+date+'</p>':'')+
  '<div style="margin:16px 0">'+esc(p.body).split("\n").map(function(x){return x?'<p>'+x+'</p>':""}).join("")+'</div>'+
  '<p class="sub">일반적인 이야기라서 모든 상황에 맞지는 않아요. 안전이 걱정되면 112 · 1366을 먼저 확인해 주세요.</p>'+
  '<button class="opt'+(saved?' sel':'')+'" onclick="toggleSave(\''+p.id+'\')">'+(saved?'저장했어요 (눌러서 취소)':'저장해 두기')+'</button><button class="ghost" onclick="back()">← 목록으로</button>';
}
// 저장한 글 목록은 사용자 기록(S)에 들어 있어서 ‘기록 모두 삭제’ 때 함께 지워진다
function toggleSave(id){S.saved=S.saved||[];var i=S.saved.indexOf(id);if(i>-1)S.saved.splice(i,1);else S.saved.push(id);save();story()}

// ----- 관리자: 새 글 / 수정 / 삭제 / 내보내기 -----
function newPost(){EDIT={id:null,title:"",body:"",tags:[]};go(Q.length+8)}
function editPost(id){var p=findPost(id);if(!p)return;EDIT={id:id,title:p.title,body:p.body,tags:(p.tags||[]).slice()};go(Q.length+8)}
function syncEdit(){var t=document.getElementById("ptitle"),b=document.getElementById("pbody");if(EDIT&&t)EDIT.title=t.value;if(EDIT&&b)EDIT.body=b.value}
function toggleTag(c){syncEdit();var i=EDIT.tags.indexOf(c);if(i>-1)EDIT.tags.splice(i,1);else EDIT.tags.push(c);editor()}
function editor(){
 if(!ADMIN){app.innerHTML='<p class="sub">관리자 모드가 꺼져 있어요.</p><button class="ghost" onclick="back()">뒤로</button>';return}
 if(!POSTS){loadPosts(function(){editor()});return}
 if(!EDIT)EDIT={id:null,title:"",body:"",tags:[]};
 var box='width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;background:var(--card);color:var(--tx);font:inherit';
 var h='<h2>'+(EDIT.id?'글 수정':'새 글 쓰기')+'</h2>'+
  '<p class="sub">제목</p><input id="ptitle" value="'+esc(EDIT.title)+'" style="'+box+'">'+
  '<p class="sub" style="margin-top:14px">내용 (줄바꿈이 그대로 보여요)</p><textarea id="pbody" rows="12" style="'+box+'">'+esc(EDIT.body)+'</textarea>'+
  '<p class="sub" style="margin-top:14px">이 글이 어울리는 상황 (여러 개 선택)</p><div>'+
  TAGS.map(function(t){var on=EDIT.tags.indexOf(t[0])>-1;return'<button class="opt'+(on?' sel':'')+'" style="display:inline-block;width:auto;margin:0 6px 8px 0;padding:6px 12px;font-size:14px" onclick="toggleTag(\''+t[0]+'\')">'+t[1]+'</button>'}).join("")+'</div>'+
  '<button class="pri" onclick="savePost()">저장</button>'+
  (EDIT.id?'<button class="ghost" style="color:var(--warn)" onclick="deletePost(\''+EDIT.id+'\')">이 글 삭제</button>':"")+
  '<button class="ghost" onclick="EDIT=null;back()">취소</button>';
 app.innerHTML=h;
}
function savePost(){
 syncEdit();
 var t=(EDIT.title||"").trim(),b=(EDIT.body||"").trim();
 if(!t||!b){alert("제목과 내용을 입력해 주세요.");return}
 if(!EDIT.tags.length){alert("어울리는 상황을 하나 이상 골라 주세요. (모두에게 보이려면 ‘모두에게’)");return}
 var now=Date.now();
 if(EDIT.id){var p=findPost(EDIT.id);if(p){p.title=t;p.body=b;p.tags=EDIT.tags.slice();p.updatedAt=now}}
 else POSTS.push({id:"p"+now.toString(36)+Math.floor(Math.random()*1296).toString(36),title:t,body:b,tags:EDIT.tags.slice(),updatedAt:now});
 savePosts();EDIT=null;back();
}
function deletePost(id){
 if(!confirm("이 글을 삭제할까요? 되돌릴 수 없어요."))return;
 POSTS=POSTS.filter(function(p){return p.id!==id});
 S.saved=(S.saved||[]).filter(function(x){return x!==id});
 savePosts();save();
 if(S.step===Q.length+8){EDIT=null;back()}else render();
}
function exportPosts(){
 var j=JSON.stringify(POSTS,null,1);
 document.getElementById("expText").value=j;
 try{navigator.clipboard.writeText(j)}catch(e){}
 document.getElementById("exp").showModal();
}
function pullPublished(){
 if(!confirm("이 기기에서 수정한 내용을 지우고, 공개된 글로 바꿀까요?"))return;
 fetch("posts.json",{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){POSTS=j;savePosts();render()}).catch(function(){alert("공개된 posts.json을 찾지 못했어요.")});
}

// PWA: 서비스 워커 등록. https 또는 localhost에서만 동작하므로 try/catch로 실패해도 앱은 정상 동작시킨다.
if("serviceWorker" in navigator){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js")}catch(e){}})}
render();
</script>
